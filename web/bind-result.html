<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>绑定结果 - 能耗与碳排管理系统</title>
<link rel="stylesheet" href="/styles.css">
</head>
<body class="auth-page">
<div class="auth-box" style="text-align:center">
  <h1 id="title">绑定结果</h1>
  <div class="sub" id="detail"></div>
  <div class="alert-warning" id="hint" style="text-align:left;display:none"></div>
  <div style="margin-top:10px;color:#888;font-size:13px">本页面可关闭</div>
</div>
<script>
(function () {
  var params = new URLSearchParams(location.search);
  var ok = params.get('ok') === '1';
  var name = params.get('name') || '';
  var err = params.get('err') || '';
  document.getElementById('title').textContent = ok ? '绑定成功' : '绑定失败';
  document.getElementById('detail').textContent = ok
    ? ('钉钉账号已与成员「' + name + '」绑定，下次可直接扫码登录')
    : (err || '未知错误，请重新扫码');
  if (!ok) {
    var hint = document.getElementById('hint');
    hint.textContent = '请回到系统管理 - 用户管理，重新生成绑定二维码后再试。';
    hint.style.display = 'block';
  }
})();
</script>
</body>
</html>
